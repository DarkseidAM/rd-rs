[package]
name = "rd-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Rust rewrite of zurg — Real-Debrid FUSE filesystem server"

[lib]
name = "rd_rs"
path = "src/lib.rs"

[[bin]]
name = "rd-rs"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# HTTP client
# reqwest 0.13: rustls feature (not rustls-tls), default-tls disabled, http2 kept
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "http2"] }

# FUSE filesystem (patched: readdirplus buffer check includes padding to avoid EIO on large dirs)
fuse3 = { version = "0.9", features = ["tokio-runtime", "unprivileged"] }

# Config
toml = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "8"

# Concurrency
dashmap = "6"
arc-swap = "1.8"

# Storage
# Pinned to 0.37 to match tokio-rusqlite 0.7's dep (avoids libsqlite3-sys version conflict)
rusqlite = "0.37"
tokio-rusqlite = "0.7"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Utilities
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2.0"
anyhow = "1.0"
once_cell = "1"
bytes = "1"
futures-util = "0.3"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tokio-util = "0.7"
tempfile = "3"
mockito = "1.7"

[patch.crates-io]
fuse3 = { path = "vendor/fuse3" }
